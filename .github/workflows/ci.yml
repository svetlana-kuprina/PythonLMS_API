name: DjangoLMS_API CI

on:
  push:
    branches:
      - Feature/homeworke_33

  pull_request:
    branches:
      - Feature/homeworke_33

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: Run linters
        run: |
          poetry run flake8 lms
          poetry run flake8 users
          
    
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: Create .env file
        run: |
          echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env
          echo "DEBUG=True" >> .env
          echo "DATABASE_URL=sqlite:///db.sqlite3" >> .env
          echo "DATABASE_USER=postgres" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> .env
          echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> .env
          echo "STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}" >> .env
          

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run:  poetry run python manage.py migrate

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          poetry run python manage.py test
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build all services with Docker Compose
        run: |
          # Собрать все образы с тегом SHA
          docker compose -f docker-compose.yml build

      - name: Tag and push all services
        run: |
          # Тегируем и пушим каждый сервис
          services=("web" "nginx" "celery" "celery-beat")
          for service in "${services[@]}"; do
            # Тегируем образ с SHA
            docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/lms_api_${service}:latest ${{ secrets.DOCKER_HUB_USERNAME }}/lms_api_${service}:${{ github.sha }}
            # Пушим оба тега
            docker push ${{ secrets.DOCKER_HUB_USERNAME }}/lms_api_${service}:${{ github.sha }}
            docker push ${{ secrets.DOCKER_HUB_USERNAME }}/lms_api_${service}:latest
          done
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Создаем директорию для проекта если её нет
            mkdir -p /opt/lms_api
            cd /opt/lms_api

            # Создаем docker-compose.yml на сервере
            cat > docker-compose.yml << 'EOL'
            services:
              web:
                image: ${{ secrets.DOCKER_HUB_USERNAME }}/lms_api_web:${{ github.sha }}
                command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
                env_file:
                  - .env
                environment:
                  - DEBUG=False
                  - DATABASE_HOST=db
                volumes:
                  - static_volume:/code/static
                ports:
                  - "8000:8000"
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped

              nginx:
                image: ${{ secrets.DOCKER_HUB_USERNAME }}/lms_api_nginx:${{ github.sha }}
                ports:
                  - "80:80"
                volumes:
                  - static_volume:/code/staticfiles
                depends_on:
                  web:
                    condition: service_started
                restart: unless-stopped

              db:
                image: postgres:17
                env_file:
                  - .env
                expose:
                  - "5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
                  interval: 30s
                  timeout: 10s
                  retries: 5

              redis:
                image: redis:7-alpine
                expose:
                  - "6379"
                volumes:
                  - redis_data:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              celery:
                image: ${{ secrets.DOCKER_HUB_USERNAME }}/lms_api_celery:${{ github.sha }}
                command: celery -A config worker --loglevel=info
                env_file:
                  - .env
                environment:
                  - DB_HOST=db
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped

              celery-beat:
                image: ${{ secrets.DOCKER_HUB_USERNAME }}/lms_api_celery-beat:${{ github.sha }}
                command: celery -A config beat --loglevel=info
                env_file:
                  - .env
                environment:
                  - DB_HOST=db
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                  celery:
                    condition: service_started
                restart: unless-stopped

            volumes:
              postgres_data:
              static_volume:
              redis_data:
            EOL