services:
  web:
    build: .
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DATABASE_HOST=db
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped #перезапуск в случае сбоя

  nginx:

    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/usr/share/nginx/html/staticfiles:ro
      - ./media:/usr/share/nginx/html/media:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped #перезапуск в случае сбоя

  db:
    image: postgres:17
    env_file:
      - .env
    environment: #необходимость
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    expose:
      - "5432" # для работы с базой
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"  # Только внутри сети
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
      build: .
      command: celery -A config beat --loglevel=info
      env_file:
        - .env
      environment:
        - DB_HOST=db
      volumes:
        - .:/code
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        celery:
          condition: service_started
      restart: unless-stopped


volumes:
  postgres_data:
  static_volume:
  redis_data: